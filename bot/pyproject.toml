[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uz-booking-bot"
version = "0.1.0"
description = "Viloyatlararo transport booking Telegram bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "cryptography>=46,<47",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "qrcode[pil]>=8.2,<9",
  "redis>=6.4,<7",
  "sentry-sdk[fastapi]>=2.40,<3",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "testcontainers[postgres,redis]>=4.13,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires disposable PostgreSQL and/or Redis services"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app/services"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
